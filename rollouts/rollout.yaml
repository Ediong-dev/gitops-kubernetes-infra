apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: portfolio-web-app
  namespace: portfolio-production
spec:
  replicas: 3
  strategy:
    canary:
      canaryService: portfolio-web-app-canary
      stableService: portfolio-web-app-stable
      trafficRouting: {}
      analysis:
        templates:
        - templateName: success-rate
        startingStep: 2    # run after the 50% step
      steps:
      - setWeight: 20
      - pause: {duration: 30}
      - setWeight: 50
      - pause: {duration: 30}
      - setWeight: 100
  selector:
    matchLabels:
      app: portfolio-web
  template:
    metadata:
      labels:
        app: portfolio-web
    spec:
      containers:
      - name: web-server
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html-volume
        configMap:
          name: web-html-config